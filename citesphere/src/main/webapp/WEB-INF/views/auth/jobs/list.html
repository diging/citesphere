<html layout:decorate="~{layouts/main}">
<head>
<script th:src="@{/resources/paginator/jquery.twbsPagination.min.js}"></script>
<script th:inline="javascript">
//# sourceURL=page.js
$(function() {
    var totalPages = [(${total})];
    var startPage = [(${page})];
    if (totalPages > 0 && startPage > 0 && startPage <= totalPages) {
        $('#pagination-top').twbsPagination({
            totalPages: totalPages,
            startPage: startPage,
            prev: "«",
            next: "»",
            visiblePages: 10,
            initiateStartPageClick: false,
            onPageClick: function (event, page) {
                window.location.href = "[(@{|/auth/jobs/sync/list|})]?page=" + (page - 1);
            }
        });
    }
    
    $('#openPruneModal').on('click', function() {
        $('#pruneModal').modal('show');
    });
    
    $('#pruneForm').on('submit', function(e) {
        var date = $('#pruneDate').val();
        if (!date) {
            e.preventDefault();
            alert('Please select a date to prune jobs.');
            return;
        }
        var message = 'This will delete all jobs up to and including ' + date + '. This cannot be undone. Continue?';
        if (!confirm(message)) {
            e.preventDefault();
        }
    });
});
</script>
</head>

<body>
<div layout:fragment="content">
<h1>Jobs</h1>

<div class="row" style="margin-bottom: 15px;">
    <div class="col-md-12">
        <button id="openPruneModal" class="btn btn-danger btn-sm">Prune jobs</button>
    </div>
</div>

<div class="modal fade" id="pruneModal" tabindex="-1" role="dialog" aria-labelledby="pruneModalLabel">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <form id="pruneForm" th:action="@{/auth/jobs/sync/prune}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <div class="modal-header">
          <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
          <h4 class="modal-title" id="pruneModalLabel">Prune jobs</h4>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label for="pruneDate">Delete jobs created on or before</label>
            <input type="date" id="pruneDate" name="pruneDate" class="form-control" required />
          </div>
          <div class="alert alert-warning" role="alert">
            This will permanently delete all jobs up to and including the selected date. This cannot be undone.
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-default" data-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-danger">Delete jobs</button>
        </div>
      </form>
    </div>
  </div>
</div>

<ul id="pagination-top" class="pagination-sm"></ul>

<table class="table table-striped">
<tr>
<th>Job ID</th>
<th>Group</th>
<th>Status</th> 
<th>Created On</th>
<th>Finished On</th>
<th></th>
<th></th>
</tr>
    <tr th:each="job:${jobs}"> 
        <td>[[${job.id}]]</td>
        <td><span class="label label-default">
                <a th:href="@{|/auth/group/${job.groupId}/items|}" style="color: #ffffff">[[${job.groupId}]] </a> 
            </span>
        </td>
        <td>[[${job.status}]]</td>
        <td>[[${job.createdOn}]]</td>
        <td>[[${job.finishedOn}]]</td>
        <td>
            <span th:if="${#strings.equals(job.status,'DONE')}"><i style="color: #629262;" class="icon-checkmark-alt"></i></span>
            <span th:if="${#strings.equals(job.status,'STARTED')}"><i style="color: orange;" class="icon-gear"></i></span>
            <span th:if="${#strings.equals(job.status,'FAILURE')}"><i style="color: #d83838;" class="icon-warning"></i></span>
            <span th:if="${#strings.equals(job.status,'PREPARED')}"><i style="color: #5d97b3;" class="icon-time"></i></span>
            <span th:if="${#strings.equals(job.status,'CANCELED')}"><i title="Job was canceled" style="color: #868181;" class="icon-warning"></i></span>
        </td>
        <td>
            <form th:if="${#strings.equals(job.status,'STARTED') or #strings.equals(job.status,'PREPARED')}" 
                    th:action="@{|/auth/jobs/sync/${job.id}/cancel|}" method="POST">
	            <button style="margin: -10px;" class="btn-link" title="Mark job as canceled">
	               <i style="color: #303540; font-size: 14px" class="icon-stop-circle" ></i>
	            </button>
            </form>
        </td>
    </tr>
</table>

</div>
</body>
</html>
