<html layout:decorate="~{layouts/main}">
<head>
<script th:src="@{/resources/paginator/jquery.twbsPagination.min.js}"></script>
<script th:inline="javascript">
//# sourceURL=page.js
$(function() {
    var selectedGroup = /*[[${selectedGroupId}]]*/ "";
    var totalPages = Number(/*[[${total}]]*/ 1) || 1;
    var currentPage = Number(/*[[${page}]]*/ 1) || 1;
    if (currentPage > totalPages) {
        currentPage = totalPages;
    }
    if (currentPage < 1) {
        currentPage = 1;
    }
    $('#pagination-top').twbsPagination({
        totalPages: totalPages,
        startPage: currentPage,
        prev: "«",
        next: "»",
        visiblePages: 10,
        initiateStartPageClick: false,
        onPageClick: function (event, page) {
            var pageParam = "?page=" + (page - 1);
            if (selectedGroup && selectedGroup.trim().length > 0) {
                pageParam = "?groupId=" + encodeURIComponent(selectedGroup) + "&page=" + (page - 1);
            }
            window.location.href = /*[[@{/auth/jobs/sync/list}]]*/ "" + pageParam;
        }
    });
});
</script>
</head>

<body>
<div layout:fragment="content">
<h1>Jobs</h1>

<div style="margin-bottom: 15px;">
    <div class="dropdown pull-left">
        <button class="btn btn-default dropdown-toggle" type="button" id="dropdownMenu1" data-toggle="dropdown" aria-haspopup="true" aria-expanded="true">
            <span th:text="${selectedGroupName}">Group</span>
            <span class="caret"></span>
        </button>
        <ul class="dropdown-menu" aria-labelledby="dropdownMenu1">
            <li><a th:href="@{/auth/jobs/sync/list}">All groups</a></li>
            <li role="separator" class="divider"></li>
            <li th:each="group : ${groups}">
                <a th:href="@{|/auth/jobs/sync/list?groupId=${group.groupId}|}"
                   th:text="${#strings.isEmpty(group.name) ? group.groupId : group.name}">Group Name</a>
            </li>
        </ul>
    </div>
    <ul id="pagination-top" class="pagination-sm pull-left" style="margin-left: 15px; margin-top: 0;"></ul>
    <div class="clearfix"></div>
</div>

<table class="table table-striped">
<tr>
<th>Job ID</th>
<th>Group</th>
<th>Status</th> 
<th>Created On</th>
<th>Finished On</th>
<th></th>
<th></th>
</tr>
    <tr th:each="job:${jobs}"> 
        <td>[[${job.id}]]</td>
        <td>
            <span class="label label-default">
                <a th:href="@{|/auth/group/${job.groupId}/items|}" style="color: #ffffff"
                        th:text="${job.groupName} ?: ${job.groupId}">[[${job.groupId}]]</a> 
            </span>
        </td>
        <td>[[${job.status}]]</td>
        <td>[[${job.createdOn}]]</td>
        <td>[[${job.finishedOn}]]</td>
        <td>
            <span th:if="${#strings.equals(job.status,'DONE')}"><i style="color: #629262;" class="icon-checkmark-alt"></i></span>
            <span th:if="${#strings.equals(job.status,'STARTED')}"><i style="color: orange;" class="icon-gear"></i></span>
            <span th:if="${#strings.equals(job.status,'FAILURE')}"><i style="color: #d83838;" class="icon-warning"></i></span>
            <span th:if="${#strings.equals(job.status,'PREPARED')}"><i style="color: #5d97b3;" class="icon-time"></i></span>
            <span th:if="${#strings.equals(job.status,'CANCELED')}"><i title="Job was canceled" style="color: #868181;" class="icon-warning"></i></span>
        </td>
        <td>
            <form th:if="${#strings.equals(job.status,'STARTED') or #strings.equals(job.status,'PREPARED')}" 
                    th:action="@{|/auth/jobs/sync/${job.id}/cancel|}" method="POST">
	            <button style="margin: -10px;" class="btn-link" title="Mark job as canceled">
	               <i style="color: #303540; font-size: 14px" class="icon-stop-circle" ></i>
	            </button>
            </form>
        </td>
    </tr>
</table>

</div>
</body>
</html>
